<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="images/fav.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/mobile-nav.js"></script>
    <script src="js/auth-utils.js"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3010897895839942"
     crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav>
            <div class="nav-left">
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                 <div class="logo">
                    <span id="welcome-message" style="display: none; font-weight: bold; font-size: 1.0rem;">Welcome to </span>
                    <span id="app-name">MyExamPadi</span>
                    <span id="username-container" style="display: none;">, <span id="user-name" style="color: #e53e3e; font-weight: bold; font-size: 1.0rem;">User</span></span>
                    <script>
                        (function() {
                            const token = localStorage.getItem('token');
                            const username = localStorage.getItem('username');
                            const welcomeMessage = document.getElementById('welcome-message');
                            const usernameContainer = document.getElementById('username-container');
                            const appName = document.getElementById('app-name');
                            
                            if (token && username) {
                                // User is logged in
                                welcomeMessage.style.display = 'inline';
                                usernameContainer.style.display = 'inline';
                                document.getElementById('user-name').textContent = username;
                                appName.style.fontWeight = 'normal';
                            } else {
                                // User is not logged in
                                welcomeMessage.style.display = 'none';
                                usernameContainer.style.display = 'none';
                                appName.style.fontWeight = 'bold';
                            }
                        })();
                    </script>
                </div>
            </div>
            <div class="nav-overlay"></div>
            <ul class="nav-links">
                <!-- <li class="user-info">
                    <span style="color: #e3e7ed;">Welcome, </span><span id="user-name" style="color: #e53e3e; font-weight: bold;">User</span>
                    <script>

                <li><a href="dashboard.html" class="active">Dashboard</a></li>

                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Exam Types</a>
                    <div class="dropdown-content">
                        <a href="neco.html">NECO</a>
                        <a href="waec.html">WAEC</a>
                        <a href="jamb.html">JAMB</a>
                    </div>
                </li>
                <li class="user-info">
                    <!-- <span id="user-name">Welcome, User</span>
                    <script>
                        (function() {
                            const username = localStorage.getItem('username');
                            if (username) {
                                document.getElementById('user-name').textContent = 'Welcome, ' + username;
                            }
                        })();
                    </script> -->
                    <button id="logout-button" onclick="handleLogout()" style="background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-left: 15px; display: none;">Logout</button>
                </li>
            </ul>
        </nav>
    </header>
    <div class="banner" style="background-color: #f8d7da; color: #721c24; text-align: center; padding: 10px; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #f5c6cb;">
        NOTE: New questions are added daily so come back everyday to test your knowledge
    </div>
    <main class="dashboard">
        <div class="container">
            <h1>Test Setup</h1>
            <div class="setup-form">
                <h2>Configure Your Exam</h2>
                <form id="test-setup-form" onsubmit="startExam(event)">
                    <div class="form-group">
                        <label for="exam-type">Select Exam Type:</label>
                        <select id="exam-type" required>
                            <option value="">Choose Exam Type</option>
                            <option value="NECO">NECO</option>
                            <option value="WAEC">WAEC</option>
                            <option value="JAMB">JAMB</option>
                            <!-- <option value="NABTEB">NABTEB</option> -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subject">Select Subject:</label>
                        <select id="subject" required>
                            <option value="">Choose Subject</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="test-duration">Test Duration (minutes):</label>
                        <select id="test-duration" required>
                            <option value="">Select Duration</option>
                            <option value="30">30 minutes</option>
                            <option value="45">45 minutes</option>
                            <option value="60">1 hour</option>
                            <option value="90">1.5 hours</option>
                            <option value="120">2 hours</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="question-count">Number of Questions:</label>
                        <select id="question-count" required>
                            <option value="">Select Questions</option>
                            <option value="10">10 Questions</option>
                            <option value="20">20 Questions</option>
                            <option value="30">30 Questions</option>
                            <option value="40">40 Questions</option>
                            <option value="50">50 Questions</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="exam-year">Exam Year:</label>
                        <select id="exam-year">
                            <option value="">All Years</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                            <option value="2020">2020</option>
                        </select>
                    </div>

                    <button type="submit" class="start-btn">Start Exam</button>
                </form>
            </div>

            <!-- <div class="previous-results">
                <h2>Previous Test Results</h2>
                <div id="results-list">
                    <p>No previous results found. Take your first test!</p>
                </div>
            </div> -->
        </div>
    </main>

    <script src="js/custom-alert.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/session-manager.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadSubjects();
            loadPreviousResults();
            
            // Initialize session management for automatic token refresh and idle timeout
            if (typeof initializeSessionManagement === 'function') {
                initializeSessionManagement();
            }
        });
    </script>
</body>
